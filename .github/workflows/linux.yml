name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test MainCore.Test -c Release

      - name: Publish
        run: ./scripts/publish-linux.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: TravianBotSharp-linux
          path: dist/TravianBotSharp-linux-*.tar.gz
          if-no-files-found: error
